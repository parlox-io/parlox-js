# Builds and tests both packages on every push and pull request. No secrets, read-only token.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check-types
  # The server package promises Node 20+, and its queue relies on timers, beforeExit and child processes, which differ
  # by platform: its tests run on every supported Node version on Windows, macOS and Linux. `node --test` with no file
  # arguments finds them on every version (glob arguments need Node 21).
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20.x, 22.x, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test --workspace packages/server
  wizard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20.x, 22.x, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - run: npm ci
      - run: node packages/wizard/scripts/check-shrinkwrap.mjs
      - run: npm test --workspace packages/wizard
  # Real installs, builds, type checks and page renders of every fixture with the wizard's changes (scripts/e2e.mjs).
  # Separate from the unit matrix because it needs the npm registry and gateway.parlox.io and takes minutes. It also
  # checks that TAG_INTEGRITY matches the file TAG_URL serves, and builds every Vite fixture with a fake
  # PARLOX_SECRET_KEY set, to prove none reaches the build output. No secrets, read-only token.
  wizard-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build --workspace packages/server --workspace packages/browser --workspace packages/wizard
      - run: node packages/wizard/scripts/e2e.mjs
